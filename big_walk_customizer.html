<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap');
</style>

<body class="wawa">
    <header>
    <img src="assets/bigwalkLogo.png" alt="">

    </header>

    <main>
    <div id="grid">
        


        <figure id="g1" class="grow"></figure>
        
        <figure id="g2" class="grow"></figure>
        
        <figure id="g3" class="grow"></figure>
    
        <figure id="g4" class="grow"></figure>
        
        <figure id="g5" class="grow"></figure>
        
        <figure id="g6" class="grow"></figure>
    
        <figure id="g7" class="grow"></figure>
    
        <figure id="g8" class="grow"></figure >
        
        <figure id="g9" class="grow"></figure >
        
        <figure id="g10" class="grow"></figure>
    
        <figure id="g11" class="grow"></figure >
        
        <figure id="g12" class="grow"></figure >
        
        <figure id="g13" class="grow"></figure>
    
        <figure id="g14" class="grow"></figure>
    
        <figure id="g15" class="grow"></figure >
        
        <figure id="g16" class="grow"></figure >
        
        <figure id="g17" class="grow"></figure>
    
        <figure id="g18" class="grow"></figure >
        
        <figure id="g19" class="grow"></figure >
        
        <figure id="g20" class="grow"></figure>
    
        <figure id="g21" class="grow"></figure>
    

    </div>    

    <div id="character">
        
        <div id="unclickable">

            <div class="parts"   id="top">    </div>
            <div class="parts"   id="middle"> </div>
            <div class="parts"   id="bottom"> </div>

        </div>


        <div id="body">
        
            <div class="parts mask1 "    id="top2">    </div>
            <div class="parts mask2 "    id="middle2"> </div>
            <div class="parts mask3"    id="bottom2"> </div>
            <div class="parts " id="special"   > </div>
        </div>



        </div>
        <!--     
        <div id = "example">
            <figure id="e1">1 x 1</figure>
            
            <figure id="e2">2 x 1</figure>
            
            <figure id="e3">3 x 1</figure>
            -->
   
   
    </div>
    </main>

    <footer>
     <h1 class="">Click on the parts of the character to change your selection.</h1>
    <p> I made this because it felt awkward standing around making my friends put colors on me while trying to get a color pallette I liked.</p>
     <h2 class="">If you want to bother me: marcelletweaver on Instagram</h2>

    </footer>

</body>





<script>

    var activePart = document.querySelector("#top2");
    const boxes = document.querySelectorAll("figure");
    const bodys = document.querySelectorAll(".parts");

    <!-- color changer-->
    boxes.forEach((div) => {
    div.addEventListener("click", (e) => {
    let bgColor = window.getComputedStyle(e.currentTarget).getPropertyValue("background-color");
    
    activePart.style.backgroundColor = bgColor;
    
    });
    });

    
    
    bodys.forEach((div) => {
    div.addEventListener("click", (e) => {
    
    activePart = document.querySelector("#" + e.target.id + "2");
    console.log(activePart);
});
    });


</script>

</html>
